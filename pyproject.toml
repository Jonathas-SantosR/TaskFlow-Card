[project]
name = "taskflowcards-web"
version = "2.0.0"
description = "Jogo educacional local com Flask e MySQL"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["banco_de_dados/dados", "backups"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
