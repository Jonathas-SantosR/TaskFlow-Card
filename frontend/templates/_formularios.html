{% macro campo(nome, rotulo, tipo='text', valor='', autocomplete='off', required=true) -%}
  <label class="campo">
    <span>{{ rotulo }}</span>
    <input name="{{ nome }}" type="{{ tipo }}" value="{{ valor }}" autocomplete="{{ autocomplete }}" {% if required %}required{% endif %}>
  </label>
{%- endmacro %}

{% macro csrf_input(token) -%}
  <input type="hidden" name="csrf" value="{{ token }}">
{%- endmacro %}

{% macro aceite_legal() -%}
  <label class="aceite-legal">
    <input type="checkbox" name="aceitou" value="1" required>
    <span>Li e aceito os <a href="{{ url_for('termos') }}">Termos de Uso e a Política de Privacidade</a>.</span>
  </label>
{%- endmacro %}
